<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>banner</title>
  <link rel="stylesheet" href="figures.css">
  <script src="figures.js"></script>
  <style>
    .banner { height: 280px; }
    .mark { position: absolute; left: 40px; top: 40px; width: 200px; height: 200px; }
    .words { position: absolute; left: 270px; top: 46px; right: 40px; }
    .words h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1.05;
      letter-spacing: -0.015em;
      font-weight: 800;
      color: var(--primary);
    }
    .words .name2 {
      margin: 8px 0 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--accent);
    }
    :root[data-lang='zh'] .words h1 { letter-spacing: 0.02em; font-size: 54px; }
    :root[data-lang='en'] .name2 { letter-spacing: 0.04em; }
    .facts {
      margin: 22px 0 0;
      font-size: 15px;
      color: var(--muted);
    }
    .seats { position: absolute; left: 270px; bottom: 36px; display: flex; gap: 9px; align-items: center; }
    .seat {
      width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700;
    }
    .seat.model { background: var(--accent-fill); color: var(--accent-ink); }
    .seat.bot { border: 2px solid var(--primary); color: var(--primary); }
    .seats .gap { width: 8px; }
    .seats .key { margin-left: 8px; font-size: 12.5px; color: var(--faint); }
    .ladder { position: absolute; right: 36px; bottom: 34px; width: 150px; height: 70px; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card banner" id="card">
    <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
      <!-- the sound block, with its plate -->
      <rect x="6" y="176" width="112" height="12" rx="6" style="fill: var(--primary-edge)"/>
      <rect x="18" y="148" width="88" height="34" rx="9" style="fill: var(--primary)"/>
      <!-- the gavel, raised and about to fall on the block -->
      <g transform="translate(98 62) rotate(-30)">
        <rect x="-9" y="22" width="18" height="110" rx="9" style="fill: var(--primary)"/>
        <rect x="-64" y="-30" width="128" height="58" rx="15" style="fill: var(--accent-fill)"/>
        <rect x="-64" y="-30" width="22" height="58" rx="11" style="fill: var(--accent)"/>
        <rect x="42" y="-30" width="22" height="58" rx="11" style="fill: var(--accent)"/>
        <rect x="-30" y="-20" width="60" height="9" rx="4.5" style="fill: #ffffff; opacity: 0.38"/>
      </g>
      <!-- the strike -->
      <path d="M 26 136 l -9 -9 M 62 130 v -13 M 98 136 l 9 -9" class="stroke-accent"/>
      <!-- the swing -->
      <path d="M 150 14 q 22 6 32 26" class="stroke-accent" style="stroke-dasharray: 1 8; opacity: .85"/>
    </svg>

    <div class="words">
      <h1><span class="en">AI Auction Night</span><span class="zh">AI 拍卖之夜</span></h1>
      <p class="name2"><span class="en">AI 拍卖之夜</span><span class="zh">AI Auction Night</span></p>
      <p class="facts">
        <span class="en">6 language models · 2 rule bots · 6 auction rules · 12 lots</span>
        <span class="zh">6 个大模型 · 2 个规则机器人 · 6 种拍卖规则 · 12 件拍品</span>
      </p>
    </div>

    <div class="seats" aria-hidden="true">
      <span class="seat model">1</span><span class="seat model">2</span><span class="seat model">3</span>
      <span class="seat model">4</span><span class="seat model">5</span><span class="seat model">6</span>
      <span class="gap"></span>
      <span class="seat bot">7</span><span class="seat bot">8</span>
    </div>

    <svg class="ladder" viewBox="0 0 150 70" aria-hidden="true">
      <!-- the ten levels of a Dutch clock, falling to the right -->
      <g style="fill: var(--primary-edge)">
        <rect x="0"   y="0"  width="12" height="70" rx="3"/>
        <rect x="15"  y="7"  width="12" height="63" rx="3"/>
        <rect x="30"  y="14" width="12" height="56" rx="3"/>
        <rect x="45"  y="21" width="12" height="49" rx="3"/>
        <rect x="60"  y="28" width="12" height="42" rx="3"/>
        <rect x="75"  y="35" width="12" height="35" rx="3"/>
        <rect x="90"  y="42" width="12" height="28" rx="3"/>
        <rect x="105" y="49" width="12" height="21" rx="3"/>
        <rect x="120" y="56" width="12" height="14" rx="3"/>
        <rect x="135" y="63" width="12" height="7"  rx="3"/>
      </g>
      <rect x="60" y="28" width="12" height="42" rx="3" style="fill: var(--accent-fill)"/>
    </svg>
  </div>
</body>
</html>
