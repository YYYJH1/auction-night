[project]
name = "auction-night"
dynamic = ["version"]
description = "A watchable auction show played by language models, with textbook mechanisms and reproducible replays."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jiahao You" }]
requires-python = ">=3.12"
keywords = ["auction", "auction-theory", "mechanism-design", "game-theory", "llm", "multi-agent", "replay"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "openai>=1.40",
  "anthropic>=0.40",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6",
  "socksio>=1.0",
]

[project.urls]
Homepage = "https://github.com/YYYJH1/auction-night"
Repository = "https://github.com/YYYJH1/auction-night"
Issues = "https://github.com/YYYJH1/auction-night/issues"
Changelog = "https://github.com/YYYJH1/auction-night/blob/main/CHANGELOG.md"

[project.scripts]
auction-night = "auction_night.cli:app"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "numpy>=2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/auction_night/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/auction_night"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["auction_night"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers"
