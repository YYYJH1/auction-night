# Offline night for tests and CI. Every model seat is a scripted mock and both bots are
# rule bots, so no endpoint, key or network is involved. The night is a full one: 12 lots,
# all six formats, all phases, missions and plans.
night:
  id: mock-0001
  seed: mock-seed-0001            # inline seeds belong in mock and test configurations only
  lang: zh
  mode: plain
  lots_per_format: 2              # 6 formats x 2 lots = 12 lots
  tags: [海洋, 机械, 甜品, 怪谈]
  tiers: {100: 5, 200: 4, 400: 3}
  budget: {c: 300, spread: [0.5, 1.5], rounding: floor}
  dutch: {levels: 10, mode: one_shot}
  english: {revise_when_remaining_le: 4, revise_timeout: keep_previous}
  blind: {value_range: [0.5, 1.5], noise: 0.2}
  missions:
    bonus: 150
    collectors: 3
    shills: 3
    shill_threshold: 0.95
    shill_formats: [english, sealed_second]
  plan_and_mindreading: true
  chat: {max_chars: 60, window_lots: 2, order: rotate, persona_max_chars: 60}
  thought: {max_chars: 100, keep_last: 2}

season:
  format: single

seats:
  - {seat: 1, codename: 鲸落, kind: mock, mock_policy: honest}
  - {seat: 2, codename: 阿铁, kind: mock, mock_policy: collude}
  - {seat: 3, codename: 小满, kind: mock, mock_policy: honest}
  - {seat: 4, codename: 拾光, kind: mock, mock_policy: collude}
  - {seat: 5, codename: 青柠, kind: mock, mock_policy: backstab}
  - {seat: 6, codename: 麦芽, kind: mock, mock_policy: random}
  - {seat: 7, codename: 老实人, kind: bot, policy: truthful}
  - {seat: 8, codename: 经济学家, kind: bot, policy: economist, pacing: true}

endpoints: {}

show:
  host_offline: {kind: mock}
  judges:
    - {kind: mock}
    - {kind: mock}
  content_scan: {wordlist: null, classifier: null}

limits:
  call_timeout_s: 5
  human_timeout_s: null
  syntax_retries: 1
  transient_retries: 0
  max_cost_per_night_usd: null
  prices_file: null
